name: RDP

on: workflow_dispatch

jobs:
  build:
  
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Configure Core RDP Settings
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User With Secure Password
      run: |
        $Password = ConvertTo-SecureString "AcidPurple41731" -AsPlainText -Force
        New-LocalUser -Name "AcidPurple123" -Password $Password
        Add-LocalGroupMember -Group "Administrators" -Member "AcidPurple123"

    - name: Install Tailscale
      run: |
        winget install Tailscale.Tailscale --silent --accept-package-agreements --accept-source-agreements

    - name: Establish Connection of Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=tskey-auth-k91dpk76z511CNTRL-d4yohfWMi31QNoHsvFDa4173j2zVVwh1

    - name: Verify RDP Accessibility
      run: |
        Write-Host "Tailscale IP:"
        & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "RDP connection successful!"

    - name: Maintain Connection
      run: |
        while ($true) { Start-Sleep -Seconds 30 }
        
